[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artificial-sort"
version = "0.1.0"
description = "RL agent that learns efficient sorting strategies on partially-ordered sets"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
]
dev = [
    "pytest>=9",
    "torch>=2.0",
]

[project.scripts]
poset-train = "train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["poset_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
