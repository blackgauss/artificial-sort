[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artificial-sort"
version = "0.3.0"
description = "RL environment for learning efficient sorting strategies on partially-ordered sets"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
jax = [
    "jax>=0.4",
    "flax>=0.9",
    "optax>=0.2",
]
notebook = [
    "torch>=2.0",
    "jax>=0.4",
    "flax>=0.9",
    "optax>=0.2",
    "matplotlib>=3.7",
    "ipywidgets>=8.0",
]
dev = [
    "pytest>=9",
    "torch>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
poset-train = "poset_rl.train:main"
poset-bench = "poset_rl.bench:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["poset_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
